server {
    listen 80;
    server_name _;
    root /var/www/html;
    index index.php index.html;
    absolute_redirect off;
    server_tokens off;
    client_max_body_size 64m;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /wp-devkit { deny all; }
    location ^~ /wp-devkit/ { deny all; }

    # ^~ stops the server-level dotfile rule, so sensitive names inside
    # .well-known/ need their own denies. A token file with no secret suffix
    # still falls through to try_files.
    location ^~ /.well-known/ {
        location ~ ^/\.well-known/(.*/)?\.[^/]+ { deny all; }
        location ~* \.(bak|old|orig|save|swp|sql|sql\.gz|sqlite|ini|log|php|phtml|phar)$ { deny all; }
        location ~* wp-config { deny all; }
        location ~* (compose\.ya?ml|Dockerfile|\.env) { deny all; }
        try_files $uri =404;
    }

    location ~ /\. {
        deny all;
    }

    location ~* \.(bak|old|orig|save|swp|sql|sql\.gz|sqlite|ini|log)$ {
        deny all;
    }

    location ~* (^|/)wp-config\.php {
        deny all;
    }

    location ~* /(compose\.ya?ml|Dockerfile)$ {
        deny all;
    }

    location ^~ /nginx/ { deny all; }
    location ^~ /php/ { deny all; }
    location ^~ /bin/ { deny all; }
    location ^~ /prompt/ { deny all; }
    location ^~ /examples/ { deny all; }

    location ~* ^/wp-content/uploads/.*\.(php|phtml|phar|php[0-9])$ {
        deny all;
    }

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass php:9000;
        fastcgi_hide_header X-Powered-By;
    }
}
