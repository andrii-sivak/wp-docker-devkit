server {
    listen 80;
    server_name _;
    root /var/www/html;
    index index.php index.html;
    absolute_redirect off;
    server_tokens off;
    client_max_body_size 64m;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location ~ /\.(env|git|wp-devkit-) { deny all; }
    location = /.dockerignore { deny all; }
    location ~* \.(sql|sql\.gz|sqlite)$ { deny all; }
    location ~* /(compose\.ya?ml|Dockerfile|wp-config\.php)$ { deny all; }
    location ^~ /nginx/ { deny all; }
    location ^~ /php/ { deny all; }
    location ^~ /bin/ { deny all; }
    location ^~ /prompt/ { deny all; }
    location ^~ /examples/ { deny all; }
    location ~* ^/wp-content/uploads/.*\.php$ { deny all; }

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass php:9000;
        fastcgi_hide_header X-Powered-By;
    }
}
